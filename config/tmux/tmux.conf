setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g status-position bottom
# set -g status 1
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:RGB"

# copy in pane
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# split windows
bind-key V split-window -h -c "#{pane_current_path}"
bind-key H split-window -v -c "#{pane_current_path}"

# ----- Design -----

# Status bar
set -g status-position bottom
set -g status-justify left

# Base status bar
set -g status-style 'fg=#ffffff bg=default'

# No left/right content
set -g status-left ''
set -g status-right ''

# Inactive windows — dim but legible
setw -g window-status-style 'fg=#5f8787 bg=default'
setw -g window-status-format ' #I #[fg=#4f8f52]#W#[fg=#aa3333] '

# Active window — bright fg on saturated bg, clear pop
setw -g window-status-current-style 'fg=#ffffff bg=#003e1f'
setw -g window-status-current-format ' #I #[fg=#ffffff]#W#[fg=#661111] '

# Bell
setw -g window-status-bell-style 'fg=#ffffff bg=#355e3b bold'



run '~/.tmux/plugins/tpm/tpm'
